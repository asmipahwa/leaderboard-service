name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Format check and unit tests
        run: ./gradlew spotlessCheck test

      # The ubuntu runner has Docker, so Testcontainers can start real Postgres and Redis.
      # `build` also enforces the JaCoCo gate (>= 80% line coverage on service + cache).
      - name: Integration tests (Testcontainers) and coverage gate
        run: ./gradlew build

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/evidence/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: leaderboard-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
