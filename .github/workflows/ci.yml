name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Format check and unit tests
        run: ./gradlew spotlessCheck test

      # The ubuntu runner has Docker, so Testcontainers can start real Postgres and Redis.
      # `build` also enforces the JaCoCo gate (>= 80% line coverage on service + cache).
      - name: Integration tests (Testcontainers) and coverage gate
        run: ./gradlew build

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse('build/reports/jacoco/test/jacocoTestReport.xml').getroot()
          m = c = 0
          for p in r.findall('package'):
              if p.get('name').endswith(('/service', '/cache')):
                  for x in p.findall('counter'):
                      if x.get('type') == 'LINE':
                          m += int(x.get('missed')); c += int(x.get('covered'))
          print(f"### Line coverage (service + cache): {c / (m + c) * 100:.1f}%")
          PY

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/evidence/

  docker:
    name: Docker image (pushed to GHCR from main)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/asmipahwa/leaderboard-service:latest
            ghcr.io/asmipahwa/leaderboard-service:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kind-smoke:
    name: Deploy to kind and call the gRPC API
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: leaderboard
          config: k8s/kind-config.yaml
      - name: Build image and load it into kind
        run: |
          docker build -t leaderboard-service:local .
          kind load docker-image leaderboard-service:local --name leaderboard
      - name: Deploy
        run: |
          kubectl apply -k k8s/overlays/local
          kubectl -n leaderboard rollout status statefulset/postgres --timeout=300s
          kubectl -n leaderboard rollout status deployment/leaderboard --timeout=600s
      - name: Seed (small data set)
        run: |
          kubectl kustomize k8s/overlays/local/seed \
            | sed 's/value: "100000"/value: "2000"/; s/value: "500000"/value: "10000"/' \
            | kubectl apply -f -
          kubectl -n leaderboard wait --for=condition=complete job/leaderboard-seed --timeout=300s
      - name: Smoke test over gRPC (NodePort 30090)
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz | tar -xz grpcurl
          ./grpcurl -plaintext localhost:30090 list
          ./grpcurl -plaintext -d '{"leaderboard":{"game_id":"fc-mobile","leaderboard_id":"season-1-high-score"},"n":3}' \
            localhost:30090 leaderboard.v1.LeaderboardService/GetTopN | tee top.json
          test "$(grep -c player_id top.json)" -eq 3
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n leaderboard get pods -o wide
          kubectl -n leaderboard describe pods | tail -80
          kubectl -n leaderboard logs deploy/leaderboard --tail=100 || true
