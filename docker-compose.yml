# Local environment: the service plus everything it depends on.
#   make up    -> postgres, redis, app
#   make seed  -> one-shot job that loads demo data, then exits
name: leaderboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leaderboard
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaderboard}
    ports:
      - "5433:5432"   # host 5433 so it never clashes with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard -d leaderboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: leaderboard-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/leaderboard
      DB_PASSWORD: ${POSTGRES_PASSWORD:-leaderboard}
      REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: json
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING: ${TRACING_SAMPLING:-1.0}
      ADMIN_ENDPOINTS: "true"   # local only: enables /admin/faults for the debugging walkthrough
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9091:9090"   # 9090 is taken by the app's gRPC port

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/leaderboard.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP over HTTP

  seed:
    image: leaderboard-service:local
    profiles: ["seed"]
    environment:
      SPRING_PROFILES_ACTIVE: seed
      DB_URL: jdbc:postgresql://postgres:5432/leaderboard
      DB_PASSWORD: ${POSTGRES_PASSWORD:-leaderboard}
      REDIS_HOST: redis
      SEED_PLAYERS: ${SEED_PLAYERS:-100000}
      SEED_EVENTS: ${SEED_EVENTS:-500000}
      SEED_RESET: ${SEED_RESET:-false}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
