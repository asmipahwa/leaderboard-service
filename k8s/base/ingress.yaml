# HTTP entry point (REST, Swagger UI, live demo page, WebSocket) via ingress-nginx.
# gRPC uses the NodePort in the local overlay; through an ingress it would need TLS + HTTP/2.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leaderboard
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # keep WebSockets open
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: leaderboard
                port:
                  name: http
