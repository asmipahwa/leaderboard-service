# EXAMPLE ONLY, for the local kind cluster. In a real environment create it out of band:
#   kubectl -n leaderboard create secret generic leaderboard-db \
#     --from-literal=DB_USER=... --from-literal=DB_PASSWORD=...
# or use External Secrets / Sealed Secrets. Never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: leaderboard-db
type: Opaque
stringData:
  DB_USER: leaderboard
  DB_PASSWORD: leaderboard
