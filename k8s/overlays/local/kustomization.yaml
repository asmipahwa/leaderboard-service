# Local kind cluster: use the image built on this machine (`kind load docker-image`) instead of
# pulling from GHCR, and expose gRPC through a NodePort.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: leaderboard
resources:
  - ../../base
  - grpc-nodeport.yaml
images:
  - name: ghcr.io/asmipahwa/leaderboard-service
    newName: leaderboard-service
    newTag: local
patches:
  - target:
      kind: Deployment
      name: leaderboard
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
