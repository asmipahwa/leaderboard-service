spring:
  application:
    name: leaderboard-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/leaderboard}
    username: ${DB_USER:leaderboard}
    password: ${DB_PASSWORD:leaderboard}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast: a hung Redis should trip the circuit breaker, not hold threads for 60 s.
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        # Simple commands share one multiplexed connection. Pipelines need a dedicated connection;
        # without a pool Lettuce would open (and close) a new TCP connection for every pipeline.
        pool:
          enabled: true
          max-active: 16
          max-idle: 16
          min-idle: 4
  lifecycle:
    timeout-per-shutdown-phase: 20s

grpc:
  server:
    port: ${GRPC_PORT:9090}
    # Let in-flight RPCs finish when the pod is asked to stop (zero-downtime rollouts).
    shutdown-grace-period: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      # Unset locally (no exporter); docker-compose and Kubernetes point it at Jaeger.
      endpoint: ${OTLP_TRACING_ENDPOINT:}
  metrics:
    tags:
      application: leaderboard-service
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

leaderboard:
  current-season: ${LEADERBOARD_SEASON:S1}
  cache:
    warm-on-startup: true
  live:
    push-interval-ms: 250
  grpc:
    default-deadline-ms: 10000
    slow-call-ms: 50
    virtual-threads: true
  admin:
    enabled: ${ADMIN_ENDPOINTS:false}
  redis:
    breaker:
      failure-rate-percent: 50
      minimum-calls: 100
      open-seconds: 5
  submit:
    # Bulkhead: at most this many submissions run at once; the rest queue (see SubmissionBulkhead).
    max-concurrent: 64
    # End-of-match writes can wait; this must stay below the default deadline.
    queue-timeout-ms: 9000
  reconciler:
    enabled: true
    interval-ms: 60000
    sample-size: 200

springdoc:
  swagger-ui:
    path: /swagger-ui.html
