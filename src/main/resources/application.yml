spring:
  application:
    name: leaderboard-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leaderboard}
    username: ${DB_USER:leaderboard}
    password: ${DB_PASSWORD:leaderboard}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  lifecycle:
    timeout-per-shutdown-phase: 20s

grpc:
  server:
    port: ${GRPC_PORT:9090}
    # Let in-flight RPCs finish when the pod is asked to stop (zero-downtime rollouts).
    shutdown-grace-period: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

leaderboard:
  current-season: ${LEADERBOARD_SEASON:S1}
  cache:
    warm-on-startup: true
  live:
    push-interval-ms: 250
  grpc:
    default-deadline-ms: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
